<!doctype html>
<html lang="en" data-theme="celeste" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fernando Pavia | Full-stack developer and AI agent engineer</title>
    <meta name="description" content="Fernando Pavia is a senior full-stack developer and AI agent engineer from Argentina. .NET, Angular, React and AI agents. Open to part-time and contract work." />
    <meta property="og:title" content="Fernando Pavia | Full-stack developer and AI agent engineer" />

    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google Analytics (GA4). Measurement ID is public by design, same as a Turnstile site key. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-XXXXXXXXXX", { anonymize_ip: true });
    </script>
    <script>
      // Set language, theme and mode before the first paint, so there is no flash.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("pf-prefs") || "{}");
          var r = document.documentElement;
          var mode = p.mode || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          r.setAttribute("data-mode", mode);
          r.setAttribute("data-theme", p.theme || "celeste");
          r.setAttribute("lang", p.lang || "en");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
